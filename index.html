<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPad Mini 天气看板</title>
    <style>
        /* 基础样式重置 */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%);
            overflow: hidden;
            text-align: center;
        }

        /* 加载与错误提示层 */
        #status-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .btn-retry {
            margin-top: 20px;
            padding: 10px 30px;
            background: #fff;
            color: #333;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
        }

        /* 主容器 */
        #app-container {
            display: none; /* 初始隐藏 */
            width: 90%;
            max-width: 800px;
        }

        /* 当前天气大卡片 */
        .current-weather {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .temp-huge {
            font-size: 120px;
            font-weight: 200;
            line-height: 1;
            margin: 10px 0;
        }

        .desc-text {
            font-size: 30px;
            opacity: 0.9;
        }

        /* 预报列表 */
        .forecast-list {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .forecast-item {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            padding: 15px 5px;
            font-size: 18px;
        }

        .f-day { font-size: 16px; opacity: 0.7; margin-bottom: 5px; }
        .f-temp { font-size: 24px; font-weight: bold; }

        /* 辅助类 */
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 状态层 -->
    <div id="status-layer">
        <h2 id="status-msg" style="font-size: 24px; margin-bottom: 10px;">正在获取天气数据...</h2>
        <p id="error-detail" style="font-size: 14px; opacity: 0.7; padding: 0 20px;"></p>
        <button class="btn-retry" onclick="initWeather()">点击重试</button>
    </div>

    <!-- 内容层 -->
    <div id="app-container">
        <div class="current-weather">
            <div id="city-name" style="font-size: 24px;">定位中...</div>
            <div class="temp-huge"><span id="cur-temp">--</span>°</div>
            <div class="desc-text" id="cur-desc">加载中</div>
        </div>

        <div class="forecast-list" id="forecast-box">
            <!-- JS 填充 -->
        </div>
    </div>

<script>
    // ==========================================
    // 配置区域
    // ==========================================
    // 请修改这里为您所在城市的经纬度 (例如北京: 39.9, 116.4)
    var LAT = 39.9042;
    var LON = 116.4074;
    // ==========================================

    var statusLayer = document.getElementById('status-layer');
    var statusMsg = document.getElementById('status-msg');
    var errorDetail = document.getElementById('error-detail');
    var appContainer = document.getElementById('app-container');

    // 初始化
    window.onload = function() {
        initWeather();
    };

    function initWeather() {
        statusLayer.classList.remove('hidden');
        appContainer.style.display = 'none';
        statusMsg.innerText = "正在连接气象卫星...";
        errorDetail.innerText = "";

        // 使用 wttr.in 的 JSON 接口，强制 HTTP 以尝试绕过 iOS 9 的 HTTPS 证书校验
        // ?format=j1 返回详细 JSON
        var url = "http://wttr.in/" + LAT + "," + LON + "?format=j1&lang=zh";

        var xhr = new XMLHttpRequest();
        xhr.open("GET", url, true);
        xhr.timeout = 10000; // 10秒超时

        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                if (xhr.status === 200) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        renderData(data);
                    } catch(e) {
                        showError("数据解析失败: " + e.message);
                    }
                } else {
                    // 如果是 Mixed Content 错误，通常 status 会是 0
                    if (xhr.status === 0) {
                         showError("网络连接被拦截 (Mixed Content)\niOS 9 禁止 HTTPS 页面访问 HTTP 接口。\n\n建议：请在电脑浏览器打开此页面测试，或寻找支持旧证书的 API。");
                    } else {
                        showError("服务器响应错误: " + xhr.status);
                    }
                }
            }
        };

        xhr.onerror = function() {
            showError("网络请求彻底失败 (可能是跨域或证书问题)");
        };

        xhr.ontimeout = function() {
            showError("连接超时");
        };

        xhr.send();
    }

    function renderData(data) {
        // 隐藏加载层
        statusLayer.classList.add('hidden');
        appContainer.style.display = 'block';

        // 1. 渲染当前天气
        var current = data.current_condition[0];
        document.getElementById('cur-temp').innerText = current.temp_C;
        document.getElementById('cur-desc').innerText = current.lang_zh ? current.lang_zh[0].value : current.weatherDesc[0].value;
        document.getElementById('city-name').innerText = "实时天气";

        // 设置背景颜色 (简单模拟)
        var code = parseInt(current.weatherCode);
        var bg = "linear-gradient(135deg, #2b5876 0%, #4e4376 100%)"; // 默认蓝紫
        if (code === 113) bg = "linear-gradient(135deg, #f6d365 0%, #fda085 100%)"; // 晴
        if (code > 200 && code < 300) bg = "linear-gradient(135deg, #4b6cb7 0%, #182848 100%)"; // 雷雨
        document.body.style.background = bg;

        // 2. 渲染未来几天 (取前3天)
        var listHtml = "";
        var days = data.weather.slice(0, 3);

        for (var i = 0; i < days.length; i++) {
            var d = days[i];
            var dateStr = d.date.substr(5); // 去掉年份，只显示 MM-DD
            var maxT = d.maxtempC;
            var minT = d.mintempC;
            // 取中午的描述作为当天描述
            var desc = d.hourly[4].lang_zh ? d.hourly[4].lang_zh[0].value : d.hourly[4].weatherDesc[0].value;

            listHtml += '<div class="forecast-item">' +
                            '<div class="f-day">' + dateStr + '</div>' +
                            '<div style="font-size:14px; margin-bottom:5px;">' + desc + '</div>' +
                            '<div class="f-temp">' + minT + '~' + maxT + '°</div>' +
                        '</div>';
        }
        document.getElementById('forecast-box').innerHTML = listHtml;
    }

    function showError(msg) {
        statusMsg.innerText = "出错了";
        // 将换行符转换为 HTML 换行
        errorDetail.innerHTML = msg.replace(/\n/g, "<br>");
    }
</script>
</body>
</html>
