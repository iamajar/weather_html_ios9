<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>北京天气看板</title>
    <style>
        :root {
            /* 统一设计：柔和的浅灰蓝渐变，不刺眼 */
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: rgba(30, 41, 59, 0.85);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            --divider: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            transition: background 0.5s ease, color 0.5s ease;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            display: -webkit-box;
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex;
            -webkit-box-pack: justify;
            -webkit-justify-content: space-between;
            -ms-flex-pack: justify;
            justify-content: space-between;
            -webkit-box-align: center;
            -webkit-align-items: center;
            -ms-flex-align: center;
            align-items: center;
            margin-bottom: 24px;
            padding: 0 4px;
        }

        .title {
            font-size: 32px; /* iPad Mini 优化 */
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .update-info {
            font-size: 18px; /* iPad Mini 优化 */
            color: var(--text-secondary);
            display: -webkit-box;
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex;
            -webkit-box-align: center;
            -webkit-align-items: center;
            -ms-flex-align: center;
            align-items: center;
            gap: 8px;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--card-border);
            border-top-color: var(--text-primary);
            border-radius: 50%;
            -webkit-animation: spin 1s linear infinite;
            animation: spin 1s linear infinite;
        }

        @-webkit-keyframes spin { to { -webkit-transform: rotate(360deg); transform: rotate(360deg); } }
        @keyframes spin { to { -webkit-transform: rotate(360deg); transform: rotate(360deg); } }

        .card {
            background: var(--card-bg);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            transition: background 0.5s ease, border 0.5s ease;
        }

        .card-title {
            font-size: 24px; /* iPad Mini 优化 */
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-secondary);
        }

        /* 当前天气 */
        .current-weather {
            display: -webkit-box;
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex;
            -webkit-box-align: center;
            -webkit-align-items: center;
            -ms-flex-align: center;
            align-items: center;
            gap: 24px;
        }

        .current-icon {
            font-size: 300px; /* iPad Mini 优化 */
            line-height: 1;
        }

        .current-details {
            -webkit-box-flex: 1;
            -webkit-flex: 1;
            -ms-flex: 1;
            flex: 1;
        }

        .current-temp {
            font-size: 72px; /* iPad Mini 优化 */
            font-weight: 300;
            line-height: 1.1;
        }

        .current-desc {
            font-size: 28px; /* iPad Mini 优化 */
            color: var(--text-secondary);
            margin-top: 4px;
            display: -webkit-box;
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex;
            -webkit-box-align: center;
            -webkit-align-items: center;
            -ms-flex-align: center;
            align-items: center;
            gap: 8px;
        }

        .current-metrics {
            display: -webkit-box;
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex;
            gap: 24px;
            margin-top: 12px;
            font-size: 20px; /* iPad Mini 优化 */
            color: var(--text-secondary);
        }

        /* 未来24小时 */
        .hourly-scroll {
            display: -webkit-box;
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex;
            overflow-x: auto;
            gap: 16px;
            padding-bottom: 8px;
            -webkit-overflow-scrolling: touch;
        }

        .hourly-scroll::-webkit-scrollbar { height: 4px; }
        .hourly-scroll::-webkit-scrollbar-thumb { background: var(--text-secondary); border-radius: 2px; }

        .hour-item {
            -webkit-box-flex: 0;
            -webkit-flex: 0 0 auto;
            -ms-flex: 0 0 auto;
            flex: 0 0 auto;
            text-align: center;
            min-width: 80px; /* iPad Mini 优化 */
        }

        .hour-time {
            font-size: 18px; /* iPad Mini 优化 */
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .hour-icon {
            font-size: 36px; /* iPad Mini 优化 */
            margin-bottom: 8px;
        }

        .hour-desc {
            font-size: 14px; /* iPad Mini 优化 */
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .hour-temp {
            font-size: 20px; /* iPad Mini 优化 */
            font-weight: 600;
        }

        /* 未来7天 */
        .daily-list {
            display: -webkit-box;
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex;
            -webkit-box-orient: vertical;
            -webkit-box-direction: normal;
            -webkit-flex-direction: column;
            -ms-flex-direction: column;
            flex-direction: column;
        }

        .daily-item {
            display: -webkit-box;
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex;
            -webkit-box-align: center;
            -webkit-align-items: center;
            -ms-flex-align: center;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--divider);
        }

        .daily-item:last-child { border-bottom: none; }

        .daily-date {
            -webkit-box-flex: 1;
            -webkit-flex: 1;
            -ms-flex: 1;
            flex: 1;
            font-size: 20px; /* iPad Mini 优化 */
            font-weight: 500;
        }

        .daily-icon {
            font-size: 32px; /* iPad Mini 优化 */
            margin: 0 20px;
        }

        .daily-desc {
            font-size: 16px; /* iPad Mini 优化 */
            color: var(--text-secondary);
            margin: 0 10px;
        }

        .daily-temps {
            display: -webkit-box;
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex;
            gap: 16px;
            font-size: 20px; /* iPad Mini 优化 */
            min-width: 100px;
            -webkit-box-pack: end;
            -webkit-justify-content: flex-end;
            -ms-flex-pack: end;
            justify-content: flex-end;
        }

        .temp-min { color: var(--text-secondary); }

        /* 加载与错误状态 */
        .status-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-gradient);
            display: -webkit-box;
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex;
            -webkit-box-orient: vertical;
            -webkit-box-direction: normal;
            -webkit-flex-direction: column;
            -ms-flex-direction: column;
            flex-direction: column;
            -webkit-box-pack: center;
            -webkit-justify-content: center;
            -ms-flex-pack: center;
            justify-content: center;
            -webkit-box-align: center;
            -webkit-align-items: center;
            -ms-flex-align: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.3s;
        }

        .status-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .error-msg {
            color: #ef4444;
            font-size: 20px; /* iPad Mini 优化 */
            text-align: center;
        }

        .retry-btn {
            margin-top: 16px;
            padding: 10px 24px;
            background: var(--text-primary);
            color: var(--bg-gradient);
            border: none;
            border-radius: 8px;
            font-size: 18px; /* iPad Mini 优化 */
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="status-overlay hidden" id="statusOverlay">
        <div class="spinner" id="spinner" style="display:none;"></div>
        <div class="error-msg" id="errorMsg" style="display:none;"></div>
        <button class="retry-btn" id="retryBtn" style="display:none;" onclick="fetchWeatherData()">重试</button>
    </div>

    <div class="container">
        <header>
            <div class="title">北京天气</div>
            <div class="update-info" id="updateTime">
                <div class="spinner" id="updateSpinner" style="display:none;"></div>
                <span id="updateText">正在获取数据...</span>
            </div>
        </header>

        <div class="card">
            <div class="current-weather">
                <div class="current-icon" id="currentIcon">--</div>
                <div class="current-details">
                    <div class="current-temp" id="currentTemp">--°</div>
                    <div class="current-desc" id="currentDesc">
                        <span id="currentDescText">--</span>
                    </div>
                    <div class="current-metrics">
                        <span>💧 湿度: <span id="currentHumidity">--</span>%</span>
                        <span>🌬️ 风速: <span id="currentWind">--</span> km/h</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">未来24小时</div>
            <div class="hourly-scroll" id="hourlyList"></div>
        </div>

        <div class="card">
            <div class="card-title">未来7天预报</div>
            <div class="daily-list" id="dailyList"></div>
        </div>
    </div>

    <script>
        // 北京坐标
        var LAT = 39.9042;
        var LON = 116.4074;
        
        // Open-Meteo API (支持 HTTP/HTTPS，无需 Key)
        var API_URL = 'https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON + '&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia%2FShanghai&forecast_days=8';

        // WMO 天气代码映射
        var weatherMap = {
            0: { desc: '晴', icon: '☀️' },
            1: { desc: '大部晴朗', icon: '🌤️' },
            2: { desc: '多云', icon: '⛅' },
            3: { desc: '阴天', icon: '☁️' },
            45: { desc: '雾', icon: '🌫️' },
            48: { desc: '雾凇', icon: '🌫️' },
            51: { desc: '小毛毛雨', icon: '🌦️' },
            53: { desc: '毛毛雨', icon: '🌦️' },
            55: { desc: '大毛毛雨', icon: '🌧️' },
            61: { desc: '小雨', icon: '🌦️' },
            63: { desc: '中雨', icon: '🌧️' },
            65: { desc: '大雨', icon: '🌧️' },
            71: { desc: '小雪', icon: '🌨️' },
            73: { desc: '中雪', icon: '🌨️' },
            75: { desc: '大雪', icon: '❄️' },
            80: { desc: '阵雨', icon: '🌦️' },
            81: { desc: '中阵雨', icon: '🌧️' },
            82: { desc: '大阵雨', icon: '⛈️' },
            95: { desc: '雷暴', icon: '⛈️' },
            96: { desc: '雷暴伴冰雹', icon: '⛈️' },
            99: { desc: '强雷暴冰雹', icon: '⛈️' }
        };

        function getWeatherInfo(code) {
            var info = weatherMap[code] || { desc: '未知', icon: '❓' };
            return { desc: info.desc, icon: info.icon };
        }

        // 安全解析时间 (修复 iOS 9 NaN:00 问题)
        function parseTime(timeStr) {
            // 将 "2023-10-25T14:00" 转换为 "2023/10/25 14:00"
            var safeStr = timeStr.replace(/-/g, '/').replace('T', ' ');
            return new Date(safeStr);
        }

        function fetchWeatherData() {
            var updateSpinner = document.getElementById('updateSpinner');
            var updateText = document.getElementById('updateText');
            var errorMsg = document.getElementById('errorMsg');
            var retryBtn = document.getElementById('retryBtn');

            updateSpinner.style.display = 'block';
            updateText.textContent = '正在获取数据...';

            var xhr = new XMLHttpRequest();
            xhr.open('GET', API_URL, true);

            xhr.onload = function() {
                if (xhr.status === 200) {
                    try {
                        var data = JSON.parse(xhr.responseText);

                        renderCurrentWeather(data.current);
                        renderHourlyForecast(data.hourly);
                        renderDailyForecast(data.daily);

                        var now = new Date();
                        updateText.textContent = '更新于 ' + (now.getHours() < 10 ? '0' : '') + now.getHours() + ':' + (now.getMinutes() < 10 ? '0' : '') + now.getMinutes();
                        updateSpinner.style.display = 'none';

                        document.getElementById('statusOverlay').className = 'hidden';
                    } catch (e) {
                        updateSpinner.style.display = 'none';
                        updateText.textContent = '数据加载失败';
                        
                        var overlay = document.getElementById('statusOverlay');
                        overlay.className = '';
                        document.getElementById('spinner').style.display = 'none';
                        errorMsg.textContent = '⚠️ 数据解析失败';
                        errorMsg.style.display = 'block';
                        retryBtn.style.display = 'block';
                    }
                } else {
                    updateSpinner.style.display = 'none';
                    updateText.textContent = '网络请求失败';
                    
                    var overlay = document.getElementById('statusOverlay');
                    overlay.className = '';
                    document.getElementById('spinner').style.display = 'none';
                    errorMsg.textContent = '⚠️ 网络请求失败';
                    errorMsg.style.display = 'block';
                    retryBtn.style.display = 'block';
                }
            };

            xhr.onerror = function() {
                updateSpinner.style.display = 'none';
                updateText.textContent = '网络连接失败';
                
                var overlay = document.getElementById('statusOverlay');
                overlay.className = '';
                document.getElementById('spinner').style.display = 'none';
                errorMsg.textContent = '⚠️ 数据获取失败，请检查网络连接';
                errorMsg.style.display = 'block';
                retryBtn.style.display = 'block';
            };

            xhr.send();
        }

        function renderCurrentWeather(current) {
            var info = getWeatherInfo(current.weather_code);
            
            document.getElementById('currentIcon').textContent = info.icon;
            document.getElementById('currentTemp').textContent = Math.round(current.temperature_2m) + '°';
            document.getElementById('currentDescText').textContent = info.desc;
            document.getElementById('currentHumidity').textContent = current.relative_humidity_2m;
            document.getElementById('currentWind').textContent = Math.round(current.wind_speed_10m);
        }

        function renderHourlyForecast(hourly) {
            var container = document.getElementById('hourlyList');
            container.innerHTML = '';
            
            // 找到当前时间最近的索引
            var now = new Date();
            var startIndex = 0;
            for (var i = 0; i < hourly.time.length; i++) {
                if (parseTime(hourly.time[i]) >= now) {
                    startIndex = i;
                    break;
                }
            }

            for (var i = startIndex; i < startIndex + 24 && i < hourly.time.length; i++) {
                var time = parseTime(hourly.time[i]);
                var hour = time.getHours();
                var info = getWeatherInfo(hourly.weather_code[i]);

                var item = document.createElement('div');
                item.className = 'hour-item';
                item.innerHTML = 
                    '<div class="hour-time">' + (i === startIndex ? '现在' : hour + ':00') + '</div>' +
                    '<div class="hour-icon">' + info.icon + '</div>' +
                    '<div class="hour-desc">' + info.desc + '</div>' +
                    '<div class="hour-temp">' + Math.round(hourly.temperature_2m[i]) + '°</div>';
                container.appendChild(item);
            }
        }

        function renderDailyForecast(daily) {
            var container = document.getElementById('dailyList');
            container.innerHTML = '';
            var weekDays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

            for (var i = 0; i < 7 && i < daily.time.length; i++) {
                var date = parseTime(daily.time[i] + 'T00:00');
                var dayName = i === 0 ? '今天' : weekDays[date.getDay()];
                var info = getWeatherInfo(daily.weather_code[i]);

                var item = document.createElement('div');
                item.className = 'daily-item';
                item.innerHTML = 
                    '<div class="daily-date">' + dayName + '</div>' +
                    '<div class="daily-icon">' + info.icon + '</div>' +
                    '<div class="daily-desc">' + info.desc + '</div>' +
                    '<div class="daily-temps">' +
                        '<span class="temp-min">' + Math.round(daily.temperature_2m_min[i]) + '°</span>' +
                        '<span>' + Math.round(daily.temperature_2m_max[i]) + '°</span>' +
                    '</div>';
                container.appendChild(item);
            }
        }

        // 初始化
        setTimeout(fetchWeatherData, 100); // 延迟加载避免初始闪烁

        // 每3分钟自动刷新数据 (180000ms)
        setInterval(fetchWeatherData, 180000);
    </script>
</body>
</html>
