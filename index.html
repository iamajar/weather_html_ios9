<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPad Mini 天气看板</title>
    <style>
        /* iOS 9 安全样式重置 */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e3c72, #2a5298); /* 默认深蓝背景 */
            transition: background 1s ease;
            overflow-x: hidden;
        }

        /* 主容器 */
        .container {
            width: 90%;
            max-width: 700px;
            text-align: center;
            padding-bottom: 40px;
        }

        /* 当前天气大卡片 */
        .current-card {
            margin-bottom: 30px;
        }

        .location {
            font-size: 32px;
            font-weight: 300;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .temp-huge {
            font-size: 140px;
            font-weight: 200;
            line-height: 1;
            margin: 10px 0;
            text-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .condition-text {
            font-size: 36px;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .details {
            font-size: 20px;
            opacity: 0.8;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        /* 预报区域标题 */
        .section-title {
            font-size: 24px;
            margin: 30px 0 15px;
            text-align: left;
            padding-left: 10px;
            border-left: 4px solid rgba(255,255,255,0.5);
        }

        /* 横向滚动列表 (未来几小时) */
        .scroll-container {
            width: 100%;
            overflow-x: auto;
            white-space: nowrap;
            padding: 10px 0;
            -webkit-overflow-scrolling: touch; /* iOS 惯性滚动 */
        }

        /* 网格列表 (未来几天) */
        .grid-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 10px;
        }

        /* 通用卡片样式 (毛玻璃效果) */
        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px); /* iOS 9 支持 */
            border-radius: 16px;
            padding: 15px;
            display: inline-block;
            vertical-align: top;
            text-align: center;
            min-width: 80px;
            margin-right: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .grid-container .card {
            flex: 1 1 30%; /* 每天占约 30% 宽度 */
            margin-right: 0;
            min-width: 0;
        }

        .card-time { font-size: 16px; opacity: 0.8; margin-bottom: 5px; }
        .card-temp { font-size: 24px; font-weight: bold; }
        .card-icon { font-size: 28px; margin: 5px 0; }

        /* 加载与错误提示 */
        #loading, #error-msg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #1e3c72;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            font-size: 24px;
        }
        #error-msg { background: #b22222; display: none; text-align: center; padding: 20px;}
        .hidden { display: none !important; }

    </style>
</head>
<body>

    <!-- 加载层 -->
    <div id="loading">正在获取气象数据...</div>

    <!-- 错误层 -->
    <div id="error-msg">
        <p style="font-size:40px; margin-bottom:20px;">⚠️ 出错了</p>
        <p id="error-text" style="font-size:20px; line-height:1.5;"></p>
        <button onclick="location.reload()" style="margin-top:30px; padding:10px 30px; font-size:20px; border:none; border-radius:8px; background:#fff; color:#b22222;">重试</button>
    </div>

    <!-- 内容层 -->
    <div class="container hidden" id="content">
        <!-- 当前天气 -->
        <div class="current-card">
            <div class="location" id="loc-name">我的位置</div>
            <div class="temp-huge"><span id="curr-temp">--</span>°</div>
            <div class="condition-text" id="curr-cond">加载中...</div>
            <div class="details">
                <span>💨 <span id="curr-wind">--</span> km/h</span>
                <span>💧 <span id="curr-hum">--</span>%</span>
            </div>
        </div>

        <!-- 未来24小时 -->
        <div class="section-title">未来几小时</div>
        <div class="scroll-container" id="hourly-list">
            <!-- JS 填充 -->
        </div>

        <!-- 未来7天 -->
        <div class="section-title">未来几天</div>
        <div class="grid-container" id="daily-list">
            <!-- JS 填充 -->
        </div>
    </div>

<script>
    // ================= 配置区 =================
    // 请修改这里为您所在城市的经纬度 (北京默认: 39.9, 116.4)
    var LAT = 39.9042;
    var LON = 116.4074;
    // =========================================

    // WMO 天气代码转文字和图标
    function getWeatherInfo(code) {
        // 简化版映射，适配 iOS 9
        if (code === 0) return { t: '晴朗', i: '☀️' };
        if (code >= 1 && code <= 3) return { t: '多云', i: '☁️' };
        if (code >= 45 && code <= 48) return { t: '雾', i: '🌫️' };
        if (code >= 51 && code <= 67) return { t: '雨', i: '🌧️' };
        if (code >= 71 && code <= 77) return { t: '雪', i: '❄️' };
        if (code >= 80 && code <= 82) return { t: '阵雨', i: '🌦️' };
        if (code >= 95) return { t: '雷雨', i: '⛈️' };
        return { t: '未知', i: '❓' };
    }

    // 设置背景色
    function setBg(code) {
        var body = document.body;
        if (code === 0) body.style.background = 'linear-gradient(135deg, #2980b9, #6dd5fa)'; // 晴蓝
        else if (code >= 1 && code <= 3) body.style.background = 'linear-gradient(135deg, #4b6cb7, #182848)'; // 多云灰蓝
        else if (code >= 51) body.style.background = 'linear-gradient(135deg, #373B44, #4286f4)'; // 雨深灰
        else if (code >= 71) body.style.background = 'linear-gradient(135deg, #83a4d4, #b6fbff)'; // 雪白
        else body.style.background = 'linear-gradient(135deg, #1e3c72, #2a5298)'; // 默认
    }

    function init() {
        // 使用 HTTP 协议绕过 iOS 9 ATS 限制
        var url = 'http://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON +
                  '&current_weather=true&hourly=temperature_2m,weathercode&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=auto';

        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);

        xhr.onload = function() {
            document.getElementById('loading').classList.add('hidden');
            if (xhr.status >= 200 && xhr.status < 400) {
                try {
                    var data = JSON.parse(xhr.responseText);
                    render(data);
                    document.getElementById('content').classList.remove('hidden');
                } catch(e) {
                    showError("数据解析失败: " + e.message);
                }
            } else {
                showError("服务器返回错误: " + xhr.status);
            }
        };

        xhr.onerror = function() {
            document.getElementById('loading').classList.add('hidden');
            showError("网络连接失败。\n\n可能原因：\n1. iPad未联网\n2. 本地文件被系统限制了网络权限\n\n建议尝试将文件上传到简单的静态网页空间访问。");
        };

        xhr.send();
    }

    function render(data) {
        var curr = data.current_weather;
        var info = getWeatherInfo(curr.weathercode);

        // 更新当前天气
        document.getElementById('curr-temp').innerText = Math.round(curr.temperature);
        document.getElementById('curr-cond').innerText = info.t;
        document.getElementById('curr-wind').innerText = curr.windspeed;
        // Open-Meteo 基础版不含湿度，这里用风速代替展示位或留空
        document.getElementById('curr-hum').innerText = '--';
        setBg(curr.weathercode);

        // 渲染未来24小时 (取前12个数据点，即12小时)
        var hourlyHtml = '';
        var nowHourIndex = 0;
        // 简单匹配当前时间的小时索引
        var currentHourStr = new Date().getHours();

        for(var i=0; i<data.hourly.time.length; i++) {
            // 简易匹配：找第一个大于等于当前时间的点
            var hTime = new Date(data.hourly.time[i]);
            if(hTime >= new Date()) {
                nowHourIndex = i;
                break;
            }
        }

        for(var j=nowHourIndex; j<nowHourIndex+12; j++) {
            if(j >= data.hourly.time.length) break;
            var hDate = new Date(data.hourly.time[j]);
            var hInfo = getWeatherInfo(data.hourly.weathercode[j]);
            hourlyHtml += '<div class="card">' +
                          '<div class="card-time">' + hDate.getHours() + ':00</div>' +
                          '<div class="card-icon">' + hInfo.i + '</div>' +
                          '<div class="card-temp">' + Math.round(data.hourly.temperature_2m[j]) + '°</div>' +
                          '</div>';
        }
        document.getElementById('hourly-list').innerHTML = hourlyHtml;

        // 渲染未来7天
        var dailyHtml = '';
        var weekDays = ['周日','周一','周二','周三','周四','周五','周六'];
        for(var k=0; k<data.daily.time.length; k++) {
            var dDate = new Date(data.daily.time[k]);
            var dInfo = getWeatherInfo(data.daily.weathercode[k]);
            var dayName = (k===0) ? '今天' : weekDays[dDate.getDay()];

            dailyHtml += '<div class="card">' +
                         '<div class="card-time">' + dayName + '</div>' +
                         '<div class="card-icon">' + dInfo.i + '</div>' +
                         '<div class="card-temp" style="font-size:18px;">' +
                         Math.round(data.daily.temperature_2m_max[k]) + '° / ' +
                         Math.round(data.daily.temperature_2m_min[k]) + '°' +
                         '</div>' +
                         '</div>';
        }
        document.getElementById('daily-list').innerHTML = dailyHtml;
    }

    function showError(msg) {
        var errDiv = document.getElementById('error-msg');
        document.getElementById('error-text').innerText = msg;
        errDiv.style.display = 'flex';
    }

    // 启动
    init();
    // 每10分钟刷新一次
    setInterval(init, 600000);

</script>
</body>
</html>
