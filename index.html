<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPad Mini 天气看板</title>
    <style>
        /* 基础样式重置 */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 加载状态 */
        #loading { font-size: 24px; opacity: 0.8; }

        /* 主界面容器 */
        #weather-container {
            display: none; /* 默认隐藏，加载成功后显示 */
            text-align: center;
            width: 90%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px); /* iOS 9 支持的前缀 */
            border-radius: 20px;
            padding: 40px 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        /* 大字体设计 */
        .city-name { font-size: 32px; margin-bottom: 10px; font-weight: 300; }
        .current-temp { font-size: 100px; font-weight: bold; line-height: 1; margin: 20px 0; }
        .weather-desc { font-size: 24px; margin-bottom: 40px; opacity: 0.9; }

        /* 未来预报列表 */
        .forecast-list {
            display: flex;
            justify-content: space-around;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 20px;
        }
        .forecast-item { text-align: center; }
        .f-day { font-size: 16px; opacity: 0.7; margin-bottom: 5px; }
        .f-temp { font-size: 20px; font-weight: bold; }

        /* 错误提示 */
        #error-msg {
            display: none;
            text-align: center;
            background: rgba(200, 50, 50, 0.8);
            padding: 30px;
            border-radius: 15px;
        }
        button {
            margin-top: 20px;
            padding: 10px 30px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            background: white;
            color: #333;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- 加载动画 -->
    <div id="loading">正在获取气象数据...</div>

    <!-- 错误提示 -->
    <div id="error-msg">
        <h2 style="margin-bottom:10px;">出错了</h2>
        <p id="error-text">无法获取数据</p>
        <button onclick="location.reload()">点击重试</button>
    </div>

    <!-- 天气内容 -->
    <div id="weather-container">
        <div class="city-name" id="city">定位中...</div>
        <div class="current-temp" id="temp">--°</div>
        <div class="weather-desc" id="desc">加载中</div>

        <div class="forecast-list" id="forecast">
            <!-- 预报内容将在这里生成 -->
        </div>
    </div>

    <script>
        // 全局回调函数，供 JSONP 调用
        function weatherCallback(data) {
            try {
                if (!data || !data.current_condition) {
                    throw new Error("数据格式异常");
                }

                var current = data.current_condition[0];
                var area = data.nearest_area ? data.nearest_area[0] : null;

                // 1. 更新当前天气
                document.getElementById('city').innerText = area ? (area.areaName[0].value || "未知城市") : "当前位置";
                document.getElementById('temp').innerText = current.temp_C + "°";
                document.getElementById('desc').innerText = current.weatherDesc[0].value;

                // 2. 更新未来预报 (取前3天)
                var forecastHtml = '';
                if (data.weather && data.weather.length > 0) {
                    for (var i = 0; i < Math.min(3, data.weather.length); i++) {
                        var day = data.weather[i];
                        var dateObj = new Date(day.date);
                        var dayName = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"][dateObj.getDay()];

                        forecastHtml += '<div class="forecast-item">' +
                            '<div class="f-day">' + dayName + '</div>' +
                            '<div class="f-temp">' + day.maxtempC + '°/' + day.mintempC + '°</div>' +
                            '</div>';
                    }
                }
                document.getElementById('forecast').innerHTML = forecastHtml;

                // 3. 切换显示状态
                document.getElementById('loading').style.display = 'none';
                document.getElementById('weather-container').style.display = 'block';

            } catch (e) {
                showError("解析数据失败: " + e.message);
            }
        }

        function showError(msg) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error-msg').style.display = 'block';
            document.getElementById('error-text').innerText = msg;
        }

        // 初始化加载
        window.onload = function() {
            // 使用 wttr.in 的 JSONP 接口
            // format=j1 返回详细JSON
            // callback=weatherCallback 指定回调函数名
            var script = document.createElement('script');
            script.src = 'http://wttr.in/?format=j1&callback=weatherCallback';

            // 超时处理
            var timeout = setTimeout(function() {
                showError("网络连接超时，请检查网络设置");
                document.body.removeChild(script);
            }, 10000); // 10秒超时

            script.onload = function() {
                clearTimeout(timeout);
            };

            script.onerror = function() {
                clearTimeout(timeout);
                showError("无法连接到气象服务器 (可能是网络拦截)");
            };

            document.body.appendChild(script);
        };
    </script>
</body>
</html>
