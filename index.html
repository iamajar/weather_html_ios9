<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>iPad 天气看板</title>
    <style>
        /* 基础重置与 iOS 9 安全字体 */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: #fff;
            min-height: 100vh;
            padding: 30px;
            line-height: 1.3;
            background-color: #1E3C72;
            -webkit-transition: background 1.5s ease;
            transition: background 1.5s ease;
            overflow-x: hidden;
        }

        /* 动态背景类 */
        .bg-clear { background: linear-gradient(160deg, #2980B9 0%, #6DD5FA 50%, #FFFFFF 100%); }
        .bg-cloudy { background: linear-gradient(160deg, #4B6CB7 0%, #182848 100%); }
        .bg-rainy { background: linear-gradient(160deg, #373B44 0%, #4286f4 100%); }
        .bg-snowy { background: linear-gradient(160deg, #8e9eab 0%, #eef2f3 100%); color: #333; }
        .bg-night { background: linear-gradient(160deg, #0f2027 0%, #203a43 50%, #2c5364 100%); }
        .bg-default { background: linear-gradient(160deg, #1E3C72 0%, #2A5298 100%); }

        .container { max-width: 1024px; margin: 0 auto; }

        /* 状态提示 */
        .status-msg { 
            text-align: center; padding: 100px 20px; 
            font-size: 24px; opacity: 0.8; font-weight: 300; 
        }
        .hidden { display: none !important; }

        /* 内容区域淡入动画 */
        #weatherContent {
            -webkit-animation: fadeIn 0.8s ease-out;
            animation: fadeIn 0.8s ease-out;
        }
        @-webkit-keyframes fadeIn { from { opacity: 0; -webkit-transform: translateY(10px); } to { opacity: 1; -webkit-transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 当前天气大卡片 */
        .current-card {
            text-align: center;
            padding: 40px 20px 30px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 24px;
            margin-bottom: 30px;
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .loc-name { font-size: 28px; font-weight: 500; letter-spacing: 1px; margin-bottom: 10px; }
        .temp-huge { 
            font-size: 140px; 
            font-weight: 200; 
            letter-spacing: -6px; 
            line-height: 1; 
            margin: 10px 0;
        }
        .temp-huge sup { font-size: 60px; font-weight: 300; vertical-align: top; margin-left: 5px; }
        .weather-desc { font-size: 32px; font-weight: 400; opacity: 0.95; margin-bottom: 15px; }
        .update-time { font-size: 16px; opacity: 0.6; font-weight: 300; }

        /* 区块标题 */
        .section-title { 
            font-size: 18px; 
            font-weight: 600; 
            opacity: 0.7; 
            margin: 25px 10px 15px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
        }

        /* 小时预报横向滚动 */
        .hourly-scroll {
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 15px;
            margin-bottom: 10px;
        }
        .hourly-scroll::-webkit-scrollbar { display: none; }
        
        .hour-card {
            -webkit-box-flex: 0;
            -webkit-flex: 0 0 auto;
            flex: 0 0 auto;
            width: 110px;
            text-align: center;
            padding: 20px 10px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            margin-right: 15px;
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
        }
        .h-time { font-size: 20px; font-weight: 500; opacity: 0.8; }
        .h-icon { font-size: 42px; margin: 12px 0; line-height: 1; }
        .h-temp { font-size: 32px; font-weight: 500; }

        /* 每日预报列表 */
        .daily-list { list-style: none; }
        .daily-card {
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;
            padding: 20px 25px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            margin-bottom: 12px;
            font-size: 24px;
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
        }
        .d-day { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; font-weight: 600; font-size: 26px; }
        .d-icon { width: 60px; text-align: center; font-size: 38px; }
        .d-desc { -webkit-box-flex: 2; -webkit-flex: 2; flex: 2; font-size: 22px; opacity: 0.8; padding-left: 10px;}
        .d-temp-range { width: 140px; text-align: right; font-weight: 500; font-size: 28px; }
        .d-temp-low { opacity: 0.5; margin-left: 12px; font-weight: 400; }

        /* 横屏适配 (iPad mini 横屏时优化布局) */
        @media screen and (orientation: landscape) {
            body { padding: 20px 40px; }
            .current-card { padding: 20px; }
            .temp-huge { font-size: 110px; }
            .weather-desc { font-size: 28px; }
        }
    </style>
</head>
<body class="bg-default">

<div class="container">
    <div id="loadingMsg" class="status-msg">正在连接气象卫星...</div>
    <div id="errorMsg" class="status-msg hidden"></div>

    <div id="weatherContent" class="hidden">
        <div class="current-card">
            <div class="loc-name" id="locName">定位中...</div>
            <div class="temp-huge" id="curTemp">--<sup>°</sup></div>
            <div class="weather-desc" id="curDesc">--</div>
            <div class="update-time" id="updateTime">--</div>
        </div>

        <div class="section-title">未来 24 小时</div>
        <div class="hourly-scroll" id="hourlyContainer"></div>

        <div class="section-title">未来 7 天预报</div>
        <ul class="daily-list" id="dailyContainer"></ul>
    </div>
</div>

<script>
// ============================================
// ⚙️ 配置区：请修改为你所在城市的经纬度
// ============================================
var CONFIG = {
    LAT: 39.9042,      // 纬度 (默认北京)
    LON: 116.4074,     // 经度 (默认北京)
    CITY_NAME: '北京',  // 显示的城市名称
    REFRESH_MS: 600000 // 刷新间隔(毫秒)，默认10分钟
};

// WMO 天气代码映射 [图标, 描述, 背景类名]
var WMO_MAP = {
    0: ['☀️', '晴', 'bg-clear'], 1: ['🌤', '大部晴朗', 'bg-clear'], 2: ['⛅', '多云', 'bg-cloudy'], 3: ['☁️', '阴', 'bg-cloudy'],
    45: ['🌫', '雾', 'bg-cloudy'], 48: ['🌫', '冻雾', 'bg-cloudy'],
    51: ['🌦', '毛毛雨', 'bg-rainy'], 53: ['🌦', '小雨', 'bg-rainy'], 55: ['🌧', '中雨', 'bg-rainy'],
    61: ['🌧', '小雨', 'bg-rainy'], 63: ['🌧', '中雨', 'bg-rainy'], 65: ['🌧', '大雨', 'bg-rainy'],
    71: ['🌨', '小雪', 'bg-snowy'], 73: ['🌨', '中雪', 'bg-snowy'], 75: ['❄️', '大雪', 'bg-snowy'],
    80: ['🌦', '阵雨', 'bg-rainy'], 81: ['🌧', '中阵雨', 'bg-rainy'], 82: ['⛈', '强阵雨', 'bg-rainy'],
    95: ['⛈', '雷暴', 'bg-rainy'], 96: ['⛈', '雷暴冰雹', 'bg-rainy'], 99: ['⛈', '强雷暴', 'bg-rainy']
};

function getWeatherInfo(code) { return WMO_MAP[code] || ['❓', '未知', 'bg-default']; }
function padZero(n) { return n < 10 ? '0' + n : '' + n; }

function formatHour(isoStr) {
    var d = new Date(isoStr);
    return padZero(d.getHours()) + ':00';
}

function formatWeekday(isoStr) {
    var days = ['周日','周一','周二','周三','周四','周五','周六'];
    var d = new Date(isoStr);
    var today = new Date();
    if (d.getFullYear() === today.getFullYear() && d.getMonth() === today.getMonth() && d.getDate() === today.getDate()) return '今天';
    var tomorrow = new Date(today); tomorrow.setDate(today.getDate() + 1);
    if (d.getFullYear() === tomorrow.getFullYear() && d.getMonth() === tomorrow.getMonth() && d.getDate() === tomorrow.getDate()) return '明天';
    return days[d.getDay()];
}

// iOS9 安全的 AJAX 请求
function fetchJSON(url, callback) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.timeout = 15000;
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
            if (xhr.status === 200 || xhr.status === 0) {
                try { callback(null, JSON.parse(xhr.responseText)); } 
                catch(e) { callback('数据解析失败', null); }
            } else { callback('网络请求失败', null); }
        }
    };
    xhr.ontimeout = function() { callback('请求超时', null); };
    xhr.onerror = function() { callback('网络错误', null); };
    xhr.send();
}

function showError(msg) {
    document.getElementById('loadingMsg').className = 'status-msg hidden';
    document.getElementById('weatherContent').className = 'hidden';
    var el = document.getElementById('errorMsg');
    el.innerHTML = msg + '<br><span style="font-size:16px;opacity:0.6;">将在下次刷新时重试</span>';
    el.className = 'status-msg';
}

function applyBackground(code, isNight) {
    var info = getWeatherInfo(code);
    var bgClass = info[2];
    // 如果是晴天/多云，且当前是夜间，切换为夜空背景
    if (isNight && (bgClass === 'bg-clear' || bgClass === 'bg-cloudy')) {
        bgClass = 'bg-night';
    }
    document.body.className = bgClass;
}

function renderWeather(data) {
    var cur = data.current_weather;
    var hourly = data.hourly;
    var daily = data.daily;
    var info = getWeatherInfo(cur.weathercode);

    // 判断是否夜间 (简单判断：晚上19点到早上6点)
    var now = new Date();
    var hour = now.getHours();
    var isNight = (hour >= 19 || hour < 6);

    // 应用动态背景
    applyBackground(cur.weathercode, isNight);

    // 当前天气
    document.getElementById('locName').textContent = CONFIG.CITY_NAME;
    document.getElementById('curTemp').innerHTML = Math.round(cur.temperature) + '<sup>°</sup>';
    document.getElementById('curDesc').textContent = info[0] + ' ' + info[1];
    document.getElementById('updateTime').textContent = '最后更新：' + padZero(now.getHours()) + ':' + padZero(now.getMinutes());

    // 小时预报
    var hContainer = document.getElementById('hourlyContainer');
    var hHTML = '';
    var startIdx = 0;
    for (var i = 0; i < hourly.time.length; i++) {
        if (new Date(hourly.time[i]) >= now) { startIdx = i; break; }
    }
    for (var j = startIdx; j < Math.min(startIdx + 24, hourly.time.length); j++) {
        var hInfo = getWeatherInfo(hourly.weathercode[j]);
        // 小时预报里的夜间图标处理 (可选，这里保持原样以简化)
        hHTML += '<div class="hour-card">' +
            '<div class="h-time">' + formatHour(hourly.time[j]) + '</div>' +
            '<div class="h-icon">' + hInfo[0] + '</div>' +
            '<div class="h-temp">' + Math.round(hourly.temperature_2m[j]) + '°</div>' +
            '</div>';
    }
    hContainer.innerHTML = hHTML;

    // 每日预报
    var dContainer = document.getElementById('dailyContainer');
    var dHTML = '';
    for (var k = 0; k < daily.time.length; k++) {
        var dInfo = getWeatherInfo(daily.weathercode[k]);
        dHTML += '<li class="daily-card">' +
            '<span class="d-day">' + formatWeekday(daily.time[k]) + '</span>' +
            '<span class="d-icon">' + dInfo[0] + '</span>' +
            '<span class="d-desc">' + dInfo[1] + '</span>' +
            '<span class="d-temp-range">' +
                Math.round(daily.temperature_2m_max[k]) + '°' +
                '<span class="d-temp-low">' + Math.round(daily.temperature_2m_min[k]) + '°</span>' +
            '</span></li>';
    }
    dContainer.innerHTML = dHTML;

    // 切换显示状态
    document.getElementById('loadingMsg').className = 'status-msg hidden';
    document.getElementById('errorMsg').className = 'status-msg hidden';
    document.getElementById('weatherContent').className = '';
}

function loadWeather() {
    var url = 'https://api.open-meteo.com/v1/forecast?' +
        'latitude=' + CONFIG.LAT +
        '&longitude=' + CONFIG.LON +
        '&current_weather=true' +
        '&hourly=temperature_2m,weathercode' +
        '&daily=weathercode,temperature_2m_max,temperature_2m_min' +
        '&timezone=auto' +
        '&forecast_days=7';

    fetchJSON(url, function(err, data) {
        if (err) { showError(err); return; }
        renderWeather(data);
    });
}

// 启动与定时刷新
loadWeather();
setInterval(loadWeather, CONFIG.REFRESH_MS);
</script>
</body>
</html>
