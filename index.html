<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPad Mini 天气看板</title>
    <style>
        /* 基础重置 */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background: #1e3c72;
            color: #fff;
            min-height: 100vh;
            display: -webkit-box;
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex;
            -webkit-box-orient: vertical;
            -webkit-box-direction: normal;
            -webkit-flex-direction: column;
            -ms-flex-direction: column;
            flex-direction: column;
            -webkit-box-align: center;
            -webkit-align-items: center;
            -ms-flex-align: center;
            align-items: center;
            -webkit-box-pack: center;
            -webkit-justify-content: center;
            -ms-flex-pack: center;
            justify-content: center;
            overflow: hidden;
            transition: background 1s ease;
        }

        /* 容器 */
        .container {
            width: 90%;
            max-width: 700px;
            text-align: center;
            padding: 20px;
        }

        /* 当前天气 */
        .current-card {
            margin-bottom: 30px;
        }
        .location {
            font-size: 32px;
            font-weight: 300;
            opacity: 0.9;
            margin-bottom: 10px;
        }
        .temp-huge {
            font-size: 140px;
            font-weight: 20;
            line-height: 1;
            margin: 10px 0;
            text-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .condition-text {
            font-size: 36px;
            font-weight: 500;
            margin-bottom: 10px;
        }
        .details {
            font-size: 20px;
            opacity: 0.8;
            display: -webkit-box;
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex;
            -webkit-box-pack: center;
            -webkit-justify-content: center;
            -ms-flex-pack: center;
            justify-content: center;
            gap: 20px;
        }

        /* 列表样式 */
        .section-title {
            font-size: 24px;
            margin: 30px 0 15px;
            text-align: left;
            padding-left: 10px;
            border-left: 4px solid rgba(255,255,255,0.5);
            width: 100%;
        }
        .scroll-container {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding: 10px 0;
            white-space: nowrap;
        }
        .grid-container {
            display: -webkit-box;
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex;
            -webkit-box-pack: justify;
            -webkit-justify-content: space-between;
            -ms-flex-pack: distribute;
            justify-content: space-between;
            -webkit-box-align: center;
            -webkit-align-items: center;
            -ms-flex-align: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .card {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 15px;
            display: inline-block;
            text-align: center;
            min-width: 80px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .grid-container .card {
            -webkit-box-flex: 1;
            -webkit-flex: 1;
            -ms-flex: 1;
            flex: 1;
            min-width: 30%;
        }
        .card-time { font-size: 16px; opacity: 0.8; margin-bottom: 5px; }
        .card-temp { font-size: 24px; font-weight: bold; }
        .card-icon { font-size: 28px; margin: 5px 0; }

        /* 错误提示层 */
        #error-msg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #b22222;
            display: -webkit-box;
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex;
            -webkit-box-orient: vertical;
            -webkit-box-direction: normal;
            -webkit-flex-direction: column;
            -ms-flex-direction: column;
            flex-direction: column;
            -webkit-box-align: center;
            -webkit-align-items: center;
            -ms-flex-align: center;
            align-items: center;
            -webkit-box-pack: center;
            -webkit-justify-content: center;
            -ms-flex-pack: center;
            justify-content: center;
            z-index: 999;
            font-size: 24px;
            text-align: center;
            padding: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- 错误显示层 -->
    <div id="error-msg">
        <p id="error-text">准备就绪</p>
        <button onclick="location.reload()" style="margin-top:30px; padding:10px 30px; font-size:20px; border:none; border-radius:8px; background:#fff; color:#b22222;">点击重试</button>
    </div>

    <!-- 主内容 -->
    <div class="container" id="content">
        <!-- 当前天气 -->
        <div class="current-card">
            <div class="location" id="loc-name">正在定位...</div>
            <div class="temp-huge"><span id="curr-temp">--</span>°</div>
            <div class="condition-text" id="curr-cond">等待数据</div>
            <div class="details">
                <span>💨 <span id="curr-wind">--</span> km/h</span>
                <span>💧 <span id="curr-hum">--</span>%</span>
            </div>
        </div>

        <!-- 未来几小时 -->
        <div class="section-title">未来几小时</div>
        <div class="scroll-container" id="hourly-list">
            <div class="card"><div class="card-time">加载中</div><div class="card-temp">--°</div></div>
        </div>

        <!-- 未来几天 -->
        <div class="section-title">未来几天</div>
        <div class="grid-container" id="daily-list">
            <div class="card"><div class="card-time">今天</div><div class="card-temp">--°</div></div>
        </div>
    </div>

    <script>
        // ================= 配置区 =================
        // 请修改为您所在城市的经纬度 (北京默认)
        var LAT = 39.9042;
        var LON = 116.4074;
        // =========================================

        // WMO 天气代码映射 (兼容 ES5)
        function getWeatherInfo(code) {
            var info = {};
            if (code === 0) {
                info.t = '晴朗'; info.i = '☀️';
            } else if (code >= 1 && code <= 3) {
                info.t = '多云'; info.i = '☁️';
            } else if (code >= 45 && code <= 48) {
                info.t = '雾'; info.i = '🌫️';
            } else if (code >= 51 && code <= 67) {
                info.t = '雨'; info.i = '🌧️';
            } else if (code >= 71 && code <= 77) {
                info.t = '雪'; info.i = '❄️';
            } else if (code >= 80 && code <= 82) {
                info.t = '阵雨'; info.i = '🌦️';
            } else if (code >= 95) {
                info.t = '雷雨'; info.i = '⛈️';
            } else {
                info.t = '未知'; info.i = '❓';
            }
            return info;
        }

        // 设置背景色
        function setBg(code) {
            var body = document.body;
            if (code === 0) {
                body.style.background = 'linear-gradient(135deg, #2980b9, #6dd5fa)';
            } else if (code >= 1 && code <= 3) {
                body.style.background = 'linear-gradient(135deg, #4b6cb7, #182848)';
            } else if (code >= 51) {
                body.style.background = 'linear-gradient(135deg, #373B44, #4286f4)';
            } else if (code >= 71) {
                body.style.background = 'linear-gradient(135deg, #83a4d4, #b6fbff)';
            } else {
                body.style.background = 'linear-gradient(135deg, #1e3c72, #2a5298)';
            }
        }

        // 主函数
        function initWeather() {
            // 强制使用 HTTP (绕过 iOS 9 ATS 限制)
            var url = 'http://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON +
                      '&current_weather=true&hourly=temperature_2m,weathercode&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=auto';

            var xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);

            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            render(data);
                            showContent();
                        } catch (e) {
                            showError("解析失败: " + e.message);
                        }
                    } else {
                        showError("网络错误: " + xhr.status);
                    }
                }
            };

            xhr.onerror = function() {
                showError("连接超时或网络故障");
            };

            xhr.send();
        }

        function render(data) {
            var curr = data.current_weather;
            var info = getWeatherInfo(curr.weathercode);

            // 更新当前天气
            document.getElementById('curr-temp').innerText = Math.round(curr.temperature);
            document.getElementById('curr-cond').innerText = info.t;
            document.getElementById('curr-wind').innerText = curr.windspeed;
            document.getElementById('curr-hum').innerText = '--'; // 基础版无湿度
            setBg(curr.weathercode);

            // 渲染未来几小时
            var hourlyHtml = '';
            var now = new Date();
            var currentHour = now.getHours();
            var startIndex = 0;
            // 找到当前时间之后的第一个数据点
            for (var i = 0; i < data.hourly.time.length; i++) {
                var t = new Date(data.hourly.time[i]);
                if (t.getHours() >= currentHour) {
                    startIndex = i;
                    break;
                }
            }
            // 生成接下来 12 小时的卡片
            for (var j = startIndex; j < startIndex + 12; j++) {
                if (j >= data.hourly.time.length) break;
                var hTime = new Date(data.hourly.time[j]);
                var hInfo = getWeatherInfo(data.hourly.weathercode[j]);
                hourlyHtml += '<div class="card">' +
                              '<div class="card-time">' + hTime.getHours() + ':00</div>' +
                              '<div class="card-icon">' + hInfo.i + '</div>' +
                              '<div class="card-temp">' + Math.round(data.hourly.temperature_2m[j]) + '°</div>' +
                              '</div>';
            }
            document.getElementById('hourly-list').innerHTML = hourlyHtml;

            // 渲染未来几天
            var dailyHtml = '';
            var weekDays = ['周日','周一','周二','周三','周四','周五','周六'];
            for (var k = 0; k < data.daily.time.length; k++) {
                var dTime = new Date(data.daily.time[k]);
                var dInfo = getWeatherInfo(data.daily.weathercode[k]);
                var dayName = (k === 0) ? '今天' : weekDays[dTime.getDay()];
                dailyHtml += '<div class="card">' +
                             '<div class="card-time">' + dayName + '</div>' +
                             '<div class="card-icon">' + dInfo.i + '</div>' +
                             '<div class="card-temp" style="font-size:18px;">' +
                             Math.round(data.daily.temperature_2m_max[k]) + '° / ' +
                             Math.round(data.daily.temperature_2m_min[k]) + '°</div>' +
                             '</div>';
            }
            document.getElementById('daily-list').innerHTML = dailyHtml;
        }

        function showError(msg) {
            var errDiv = document.getElementById('error-msg');
            var errText = document.getElementById('error-text');
            errText.innerText = msg;
            errDiv.style.display = 'flex'; // 强制显示
        }

        function showContent() {
            document.getElementById('error-msg').style.display = 'none';
        }

        // 页面加载完成后启动
        window.onload = function() {
            try {
                initWeather();
                // 每 10 分钟自动刷新
                setInterval(initWeather, 600000);
            } catch (e) {
                showError("初始化异常: " + e.message);
            }
        };
    </script>
</body>
</html>
